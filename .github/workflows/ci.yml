name: My First CI
on: [push]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # 1. CI Part: Test the code
      - name: Run my Python script
        run: python hello.py
        
      # 2. CD Part: Save the output (Artifact)
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-python-app
          path: hello.py
